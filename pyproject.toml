[project]
name = "agent-forum"
version = "0.1.0"
description = "Harness + append-only message board + council audit task for isolated agent boxes"
requires-python = ">=3.11"
dependencies = [
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "docker>=7.0",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-c>=0.23",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-asyncio>=0.23"]
astgrep = ["ast-grep-py>=0.30"]

[project.scripts]
harness = "harness.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
